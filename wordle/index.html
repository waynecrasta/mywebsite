<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wayne & Kanchi Wordle</title>
  <meta name="description" content="Play our custom Wordle! Celebrate Wayne & Kanchi with a fun daily puzzle.">
  <link rel="canonical" href="https://www.waynecrasta.com/wordle/">

  <!-- Open Graph (WhatsApp, Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.waynecrasta.com/wordle/">
  <meta property="og:title" content="Wayne & Kanchi Wordle">
  <meta property="og:description" content="Play our custom Wordle! Celebrate Wayne & Kanchi with a fun daily puzzle.">
  <meta property="og:image" content="https://www.waynecrasta.com/img/WKLogo.png">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Wayne & Kanchi Wordle">
  <meta name="twitter:description" content="Play our custom Wordle! Celebrate Wayne & Kanchi with a fun daily puzzle.">
  <meta name="twitter:image" content="https://www.waynecrasta.com/img/WKLogo.png">
  <meta name="theme-color" content="#111111">
  <style>
    html, body { height: 100%; margin: 0; }
    #embed { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; }
    #fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body>
  <iframe id="embed" src="https://nyt-wedding.vercel.app/wordle" title="Wordle" allowfullscreen></iframe>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://nyt-wedding.vercel.app/wordle">
    <div id="fallback">Redirecting to Wordle…</div>
  </noscript>
  <script>
    (function () {
      var FALLBACK_MS = 1500;
      var didFallback = false;
      var iframe = document.getElementById('embed');
      // If the iframe loads, cancel redirect
      iframe.addEventListener('load', function () { didFallback = true; });
      // If framing is blocked, navigate after a brief delay
      setTimeout(function () {
        if (!didFallback) window.location.replace('https://nyt-wedding.vercel.app/wordle');
      }, FALLBACK_MS);
    })();
  </script>
</body>
</html>
